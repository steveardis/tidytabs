[project]
name = "tidytabs"
version = "0.1.0"
description = "Review, close, organize, and find your Brave or Chrome tabs from the terminal, with an AI that learns what you close."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["browser", "tabs", "brave", "chrome", "cli", "macos", "openrouter"]
authors = [
    { name = "Steve Ardis", email = "scardis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.scripts]
tidytabs = "tidytabs.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
