name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tests use fakes for the browser, the Keychain, and OpenRouter, so they do not need macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Static check (unused or undefined names)
        run: uvx ruff check src tests scripts --select F
